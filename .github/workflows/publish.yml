on:
  push:
    branches: master

name: Render and Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # --- FERRAMENTAS DO SISTEMA (LINUX) ---
      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libfreetype6-dev libharfbuzz-dev libfribidi-dev libpng-dev libtiff5-dev libjpeg-dev libgdal-dev libgeos-dev libproj-dev libudunits2-dev libmagick++-dev cargo
      # --------------------------------------

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      # --- PACOTES DO R ---
      - name: Install R packages
        run: |
          install.packages("rmarkdown")
          install.packages("knitr")
          install.packages("tidyverse")
          install.packages("readxl")
          install.packages("downlit")
          install.packages("xml2")
          install.packages("DT")
          install.packages("plotly")
          install.packages("formattable")
          install.packages("kableExtra")
          install.packages("webshot2")
          install.packages("magick")
          install.packages("transformr")
          install.packages("gifski")
          install.packages("gganimate")
          install.packages("abjutils")
        shell: Rscript {0}
      # --------------------

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
